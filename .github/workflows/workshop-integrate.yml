name: Integrate workshop checkpoint
on:
  push:
    branches: [feat/ash-jackal-workshop]
    paths: ['.workshop/patch.b64', '.workshop/repair.json', '.github/workflows/workshop-integrate.yml']
permissions:
  contents: write
concurrency:
  group: workshop-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/ash-jackal-workshop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ash-jackal-workshop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compiler and dependency inputs
        run: |
          rustup target add wasm32-unknown-unknown
          npm ci
          mkdir -p /tmp/workshop-inputs/compiler/bin /tmp/workshop-inputs/compiler/lib
          SYSROOT=$(rustc --print sysroot)
          cp -L "$SYSROOT/bin/rustc" "$SYSROOT/bin/cargo" /tmp/workshop-inputs/compiler/bin/
          cp -L "$SYSROOT"/lib/*.so* /tmp/workshop-inputs/compiler/lib/ 2>/dev/null || true
          cp -rL "$SYSROOT/lib/rustlib" /tmp/workshop-inputs/compiler/lib/
          tar -czf /tmp/workshop-inputs/dependencies.tgz node_modules
          cp .workshop/patch.b64 /tmp/workshop-inputs/patch.b64 2>/dev/null || true
      - name: Apply authored patch
        id: patch
        run: |
          if [ ! -f .workshop/patch.b64 ]; then echo 'present=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'present=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import base64, gzip, pathlib, json
          data=pathlib.Path('.workshop/patch.b64').read_text()
          repair=pathlib.Path('.workshop/repair.json')
          if repair.exists():
              for change in sorted(json.loads(repair.read_text()), key=lambda c:c['start'], reverse=True):
                  assert data[change['start']:change['end']]==change['old']
                  data=data[:change['start']]+change['new']+data[change['end']:]
          pathlib.Path('/tmp/workshop.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/workshop.patch
          git apply --index /tmp/workshop.patch
      - name: Verify simulation and build
        if: steps.patch.outputs.present == 'true'
        run: |
          cargo test --manifest-path sim/Cargo.toml
          cargo test --manifest-path sim/Cargo.toml --features workshop
          npm run build
          cargo build --manifest-path sim/Cargo.toml --release --target wasm32-unknown-unknown --features workshop --target-dir sim/target/workshop
          mkdir -p tools
          cp sim/target/workshop/wasm32-unknown-unknown/release/starhold_sim.wasm tools/sim.workshop.wasm
          npm run test:workshop --if-present
      - name: Commit verified checkpoint (no merge or deployment)
        if: steps.patch.outputs.present == 'true'
        run: |
          git rm .workshop/patch.b64
          git rm --ignore-unmatch .workshop/repair.json
          git config user.name 'Starhold Workshop'
          git config user.email 'workshop@users.noreply.github.com'
          git commit -m 'feat: integrate verified workshop checkpoint'
          git push origin HEAD:feat/ash-jackal-workshop
      - name: Archive verification state
        if: always()
        run: |
          mkdir -p /tmp/workshop-inputs/source/sim
          cp -r src /tmp/workshop-inputs/source/
          cp -r sim/src sim/Cargo.toml /tmp/workshop-inputs/source/sim/
          for p in tools scripts dist; do cp -r "$p" /tmp/workshop-inputs/source/ 2>/dev/null || true; done
          cp public/sim.wasm /tmp/workshop-inputs/source/sim.wasm
          git rev-parse HEAD > /tmp/workshop-inputs/source/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-checkpoint-${{ github.run_id }}
          path: /tmp/workshop-inputs
          retention-days: 1
