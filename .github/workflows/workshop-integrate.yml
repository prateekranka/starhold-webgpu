name: Integrate workshop checkpoint
on:
  push:
    branches: [feat/ash-jackal-workshop]
    paths: ['.workshop/frontend.py', '.workshop/capture.py', '.github/workflows/workshop-integrate.yml', 'scripts/workshop-browser.mjs', 'scripts/workshop-gpu.mjs']
permissions:
  contents: write
concurrency:
  group: workshop-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/ash-jackal-workshop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ash-jackal-workshop
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed integration edits
        run: |
          python3 .workshop/frontend.py
          python3 .workshop/capture.py
      - name: Verify simulation and builds
        run: |
          rustup target add wasm32-unknown-unknown
          npm ci
          cargo test --manifest-path sim/Cargo.toml
          cargo test --manifest-path sim/Cargo.toml --features workshop
          npm run build
          npm run wasm:workshop
          bash scripts/build-baseline.sh
          npm run test:workshop
      - name: Install software WebGPU and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { cat /tmp/browser-install.log; exit 1; }
      - name: Browser checks and captures
        env:
          WORKSHOP_HEADED: '1'
          WORKSHOP_GPU_LOG: '1'
        run: xvfb-run -a npm run test:workshop:browser
      - name: Commit verified frontend checkpoint
        run: |
          git add src sim/src scripts tests package.json .gitignore lab.html
          git rm .workshop/frontend.py .workshop/capture.py
          git config user.name 'Starhold Workshop'
          git config user.email 'workshop@users.noreply.github.com'
          git commit -m 'feat: connect verified production asset, research and encounter tools'
          git push origin HEAD:feat/ash-jackal-workshop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: workshop-evidence
          retention-days: 7
