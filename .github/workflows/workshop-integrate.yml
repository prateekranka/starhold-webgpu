name: Integrate workshop checkpoint
on:
  push:
    branches: [feat/ash-jackal-workshop]
    paths: ['.workshop/patch.b64', '.workshop/repair.json', '.github/workflows/workshop-integrate.yml']
permissions:
  contents: write
concurrency:
  group: workshop-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/ash-jackal-workshop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ash-jackal-workshop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply authored patch
        id: patch
        run: |
          if [ ! -f .workshop/patch.b64 ]; then echo 'present=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'present=true' >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import base64, gzip, pathlib, json, zlib
          data=pathlib.Path('.workshop/patch.b64').read_text()
          repair=pathlib.Path('.workshop/repair.json')
          if repair.exists():
              changes=json.loads(repair.read_text())
              for c in changes:
                  if 'start' not in c:
                      assert data.count(c['old'])==1
                      data=data.replace(c['old'],c['new'])
              for c in sorted([c for c in changes if 'start' in c],key=lambda c:c['start'],reverse=True):
                  assert data[c['start']:c['end']]==c['old']
                  data=data[:c['start']]+c['new']+data[c['end']:]
          encoded=base64.b64decode(data)
          try:
              decoded=gzip.decompress(encoded)
          except Exception:
              stream=zlib.decompressobj(31); output=b''
              for i,b in enumerate(encoded):
                  try: output+=stream.decompress(bytes([b]))
                  except Exception:
                      print('Transport failure near base64 offset',i*4//3)
                      print('Last decoded source:',output[-3000:].decode('utf-8','replace'))
                      raise
              raise
          pathlib.Path('/tmp/workshop.patch').write_bytes(decoded)
          PY
          git apply --check /tmp/workshop.patch
          git apply --index /tmp/workshop.patch
      - name: Verify simulation and build
        if: steps.patch.outputs.present == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          npm ci
          cargo test --manifest-path sim/Cargo.toml
          cargo test --manifest-path sim/Cargo.toml --features workshop
          npm run build
          cargo build --manifest-path sim/Cargo.toml --release --target wasm32-unknown-unknown --features workshop --target-dir sim/target/workshop
          mkdir -p tools
          cp sim/target/workshop/wasm32-unknown-unknown/release/starhold_sim.wasm tools/sim.workshop.wasm
          npm run test:workshop --if-present
      - name: Commit verified checkpoint (no merge or deployment)
        if: steps.patch.outputs.present == 'true'
        run: |
          git rm .workshop/patch.b64
          git rm --ignore-unmatch .workshop/repair.json
          git config user.name 'Starhold Workshop'
          git config user.email 'workshop@users.noreply.github.com'
          git commit -m 'feat: integrate verified workshop checkpoint'
          git push origin HEAD:feat/ash-jackal-workshop
      - name: Archive verification state
        if: always()
        run: |
          mkdir -p /tmp/workshop-checkpoint/sim
          cp -r src /tmp/workshop-checkpoint/
          cp -r sim/src sim/Cargo.toml /tmp/workshop-checkpoint/sim/
          for p in tools scripts dist; do cp -r "$p" /tmp/workshop-checkpoint/ 2>/dev/null || true; done
          cp public/sim.wasm /tmp/workshop-checkpoint/sim.wasm
          cp .workshop/patch.b64 /tmp/workshop-checkpoint/patch.b64 2>/dev/null || true
          git rev-parse HEAD > /tmp/workshop-checkpoint/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-checkpoint-${{ github.run_id }}
          path: /tmp/workshop-checkpoint
          retention-days: 1
