name: Workshop verification

on:
  push:
    branches: [master, feat/ash-jackal-workshop]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install WASM target and dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          npm ci
      - name: Production and workshop Rust tests
        run: |
          cargo test --manifest-path sim/Cargo.toml
          cargo test --manifest-path sim/Cargo.toml --features workshop
      - name: Strict TypeScript and production build
        run: npm run build
      - name: Isolated tools and pinned baseline
        run: |
          npm run wasm:workshop
          bash scripts/build-baseline.sh
      - name: Runtime contract and showcase regression tests
        run: npm run test:workshop
      - name: Install software WebGPU and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          npx playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { cat /tmp/browser-install.log; exit 1; }
      - name: Real-pixel browser checks and captures
        env:
          WORKSHOP_HEADED: '1'
          WORKSHOP_GPU_LOG: '1'
        run: xvfb-run -a npm run test:workshop:browser
      - name: Verification provenance
        if: always()
        run: |
          mkdir -p workshop-evidence
          git rev-parse HEAD > workshop-evidence/verified-commit.txt
          printf '%s\n' "run=$GITHUB_RUN_ID" "attempt=$GITHUB_RUN_ATTEMPT" "event=$GITHUB_EVENT_NAME" > workshop-evidence/verification-run.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workshop-evidence/*.png
            workshop-evidence/*.json
            workshop-evidence/*.txt
          retention-days: 7
          if-no-files-found: error
